<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Savol bor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="participant">
  <header class="bar">
    <h1 class="brand" data-i18n="title">Savol bor</h1>
    <div class="langs" role="group" aria-label="language">
      <button type="button" data-lang="uz">uz</button>
      <button type="button" data-lang="en">en</button>
    </div>
  </header>

  <div id="offline" class="offline" role="status" hidden data-i18n="offline"></div>

  <main class="wrap">
    <form id="ask" class="ask" novalidate>
      <textarea id="text" rows="3" data-i18n-placeholder="askPlaceholder" aria-label="question" autocomplete="off"></textarea>
      <div class="ask-row">
        <input id="name" type="text" maxlength="40" data-i18n-placeholder="namePlaceholder" aria-label="name" autocomplete="nickname">
        <button id="send" type="submit" class="primary" data-i18n="send">Yuborish</button>
      </div>
      <div class="ask-meta">
        <span id="counter" class="counter" aria-live="polite"></span>
        <span id="askError" class="error" role="alert"></span>
      </div>
    </form>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-sort="top" data-i18n="top">Koʻp ovoz</button>
      <button type="button" role="tab" data-sort="newest" data-i18n="newest">Yangi</button>
    </nav>

    <section id="highlight" class="highlight" hidden></section>
    <ol id="list" class="questions"></ol>
    <p id="empty" class="empty" hidden data-i18n="empty"></p>

    <details id="answeredBox" class="answered-box" hidden>
      <summary><span data-i18n="answered">Javob berilgan</span> <span id="answeredCount"></span></summary>
      <ol id="answeredList" class="questions"></ol>
    </details>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
