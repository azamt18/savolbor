<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Savol bor · host</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="host">
  <header class="bar">
    <h1 class="brand" data-i18n="hostTitle">Savollarni boshqarish</h1>
    <div class="langs" role="group" aria-label="language">
      <button type="button" data-lang="uz">uz</button>
      <button type="button" data-lang="en">en</button>
    </div>
  </header>

  <div id="offline" class="offline" role="status" hidden data-i18n="offline"></div>

  <main class="wrap">
    <div class="host-tools">
      <span id="count" class="count" aria-live="polite"></span>
      <a href="/api/host/export.md" download data-i18n="export">Markdown yuklab olish</a>
      <button type="button" id="projectorOn" class="primary" data-i18n="projector">Proyektor rejimi</button>
    </div>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-sort="top" data-i18n="top">Koʻp ovoz</button>
      <button type="button" role="tab" data-sort="newest" data-i18n="newest">Yangi</button>
    </nav>

    <ol id="list" class="questions"></ol>
    <p id="empty" class="empty" hidden data-i18n="empty"></p>
    <p id="hostError" class="error" role="alert"></p>
  </main>

  <section class="projector-view" aria-live="polite">
    <div>
      <div id="pjNow" class="pj-now" hidden></div>
      <ol id="pjTop" class="questions pj-top"></ol>
    </div>
    <aside class="pj-join">
      <img src="/qr.png" alt="">
      <p data-i18n="joinAt">Savol berish uchun skanerlang yoki oching:</p>
      <p id="pjUrl" class="url"></p>
    </aside>
    <button type="button" id="projectorOff" class="pj-exit" data-i18n="exitProjector">Proyektordan chiqish</button>
  </section>

  <script src="/static/i18n.js"></script>
  <script src="/static/host.js"></script>
</body>
</html>
